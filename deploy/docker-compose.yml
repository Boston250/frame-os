services:
  app:
    build: ..
    env_file: ../.env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD-SHELL","wget -qO- http://localhost:3000/ >/dev/null"], interval: 15s, timeout: 5s, retries: 5 }
  api:
    build: ..
    command: ["npm","run","api"]
    env_file: ../.env
    volumes: ["frame_exports:/var/lib/frame/exports:ro"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD-SHELL","wget -qO- http://localhost:4000/api/health >/dev/null"], interval: 15s, timeout: 5s, retries: 5 }
  worker:
    build: ..
    command: ["npm","run","worker"]
    env_file: ../.env
    volumes: ["frame_exports:/var/lib/frame/exports"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
  migrate:
    build: ..
    command: ["npm","run","db:migrate"]
    env_file: ../.env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frame_os
      POSTGRES_USER: frame_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["frame_postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U frame_os"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["frame_redis:/data"]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80","443:443"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro","./certs:/etc/nginx/certs:ro"]
    depends_on:
      app: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  frame_postgres:
  frame_redis:
  frame_exports:
