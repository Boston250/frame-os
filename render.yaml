services:
  - type: web
    name: frame-os-trial
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: SESSION_SECRET
        generateValue: true
      - key: FRAME_RUN_INITIAL_SEED
        value: "true"
      - key: FRAME_BOOTSTRAP_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_FRAME_API_MODE
        value: live
